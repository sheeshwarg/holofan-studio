[package]
name = "holofan_studio"
version = "13.0.0"
edition = "2024"
description = "HoloFan Studio - control and program 3D hologram fans (Windows and macOS)"

[[bin]]
name = "holofan_studio"
path = "src/main.rs"

[dependencies]
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
eframe = { version = "0.37.0", features = ["persistence"] }
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "gif", "bmp"] }
rfd = "0.18.0"
sysinfo = { version = "0.40.4", default-features = false, features = ["disk"] }

[target.'cfg(target_os = "macos")'.dependencies]
# same winit eframe uses; needed to open the screenshot window without activating the app
winit = "0.30"

[profile.release]
opt-level = 3
lto = "thin"
strip = true

# For `cargo bundle --release` on macOS (creates "HoloFan Studio.app")
[package.metadata.bundle]
name = "HoloFan Studio"
identifier = "app.holofanstudio.desktop"
version = "13.0.0"
category = "public.app-category.utilities"
short_description = "Control and program 3D hologram fans"
osx_minimum_system_version = "11.0"
